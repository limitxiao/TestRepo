name: GPU capability probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted]
    timeout-minutes: 5
    steps:
      - name: Probe CUDA device
        shell: bash
        run: |
          set -x
          uname -a
          command -v nvidia-smi || true
          nvidia-smi -L || true
          test -e /dev/nvidia0 && echo GPU_DEVICE_PRESENT || true
